name: Release Packages
on: workflow_dispatch

# prevent multiple simultaneous test runs
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # pull-requests: write  # PRs generated by GHA token can't run status checks, so need to use a PAT token instead
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Restore cached dependencies for Node modules.
        id: module-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}--node--${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          npx node-gyp@12.2.0 install
          yarn install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          publish: yarn release-packages
          version: yarn version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
          NPM_TOKEN: ""
